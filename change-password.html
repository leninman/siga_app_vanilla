<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar clave - SIGA ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh;">
  <div id="menu-container"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="glass-card p-4 p-md-5 animate-fade-in-up">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 62px; height: 62px; background: var(--accent-light); color: var(--accent-hover);">
              <i class="fa-solid fa-key fa-xl"></i>
            </div>
            <h3 class="mb-2">Cambiar clave</h3>
            <p class="text-muted mb-0">Para proteger tu cuenta, confirma tu clave actual antes de crear una nueva.</p>
          </div>

          <form id="changePasswordForm" novalidate>
            <div class="form-group">
              <label for="currentPassword">Clave actual</label>
              <div class="input-group">
                <input id="currentPassword" name="currentPassword" type="password" class="form-control" autocomplete="current-password" required>
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="currentPassword" aria-label="Mostrar u ocultar clave actual"><i class="fa-solid fa-eye"></i></button>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="newPassword">Nueva clave</label>
              <div class="input-group">
                <input id="newPassword" name="newPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp">
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword" aria-label="Mostrar u ocultar nueva clave"><i class="fa-solid fa-eye"></i></button>
                </div>
              </div>
              <small id="passwordHelp" class="form-text text-muted">Debe contener al menos 8 caracteres.</small>
            </div>

            <div class="form-group mb-4">
              <label for="confirmPassword">Confirmar nueva clave</label>
              <div class="input-group">
                <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword" aria-label="Mostrar u ocultar confirmación de clave"><i class="fa-solid fa-eye"></i></button>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end">
              <a class="btn btn-light mr-2" href="/home.html">Cancelar</a>
              <button class="btn btn-primary px-4" type="submit"><i class="fa-solid fa-check mr-1"></i> Actualizar clave</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/change-password.js"></script>
</body>
</html>
