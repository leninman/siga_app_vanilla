<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Docente - Siga App Premium</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div class="page-container">
    <div id="menu-container"></div>

    <div class="main-content-area">
      <div class="container-fluid mt-4 mb-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="font-weight-bold">Registro de Docente</h2>
          <a href="/teacher.html" class="btn btn-outline-primary shadow-sm">Volver a la Lista</a>
        </div>
        <hr>
    
    <form id="formDocente">
      <div class="card shadow-lg border-0 rounded-lg mb-4">
        <div class="card-body p-4">
          <h5 class="card-title text-primary font-weight-bold mb-4">Datos Personales</h5>
          
          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Primer Nombre *</label>
              <input type="text" class="form-control premium-input text-dark" name="primerNombre" style="background:#f8f9fa !important" required>
            </div>
            <div class="form-group col-md-6">
              <label>Segundo Nombre</label>
              <input type="text" class="form-control premium-input text-dark" name="segundoNombre" style="background:#f8f9fa !important">
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Primer Apellido *</label>
              <input type="text" class="form-control premium-input text-dark" name="primerApellido" style="background:#f8f9fa !important" required>
            </div>
            <div class="form-group col-md-6">
              <label>Segundo Apellido</label>
              <input type="text" class="form-control premium-input text-dark" name="segundoApellido" style="background:#f8f9fa !important">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Cédula *</label>
              <input type="number" class="form-control premium-input text-dark" name="numeroDocumento" style="background:#f8f9fa !important" required>
            </div>
            <div class="form-group col-md-6">
              <label>Especialidad</label>
              <input type="text" class="form-control premium-input text-dark" name="especialidad" style="background:#f8f9fa !important" placeholder="Ej. Matemáticas, Física">
            </div>
          </div>

        </div>
      </div>

        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module">
    import { initMenu } from '/menu.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      initMenu();
      
      document.getElementById('formDocente').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        console.log('Datos del Docente:', data);
        
        Swal.fire({
          title: '¡Guardado!',
          text: 'El docente ha sido registrado con éxito.',
          icon: 'success'
        }).then(() => {
          window.location.href = '/teacher.html';
        });
      });
    });
  </script>
</body>
</html>
