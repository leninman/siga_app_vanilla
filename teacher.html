<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Profesores - Siga App Premium</title>
  
  <!-- CSS Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  
  <!-- CSS DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap4.min.css">
  
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div class="page-container">
    <div id="menu-container"></div>

    <div class="main-content-area">
      <div class="container-fluid mt-4 animate-fade-in-up" style="padding-bottom: 40px;">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2>Lista de Docentes</h2>
          <div>
            <a href="/home.html" class="btn btn-outline-secondary mr-2 shadow-sm">Volver al Inicio</a>
            <button class="btn btn-success shadow-sm" id="btnAddTeacher" onclick="window.location.href='/teacher-form.html'">Agregar Docente</button>
          </div>
        </div>
    
    <hr>

    <div class="card shadow-lg border-0 rounded-lg">
      <div class="card-body table-responsive p-4">
        
        <!-- Tabla Vanilla Lista para DataTables con Premium Style -->
        <table id="datatableTeacher" class="table table-hover w-100 premium-table">
          <thead class="text-white" style="background: linear-gradient(45deg, #1e3c72, #2a5298);">
            <tr>
              <th>Id</th>
              <th>Cédula</th>
              <th>Nombre y Apellido</th>
              <th>Especialidad</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- El contenido se inyectará dinámicamente vía JS -->
          </tbody>
        </table>

      </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>
  
  <!-- Integración Global de SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Lógica Vanilla de esta vista y el Sidebar -->
  <script type="module">
    import { initMenu } from '/menu.js';
    import '/teacher-list.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      initMenu();
    });
  </script>
</body>
</html>
